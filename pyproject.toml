[project]
name = "alfred-workflow-wanikani"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pillow", "pip-audit", "pyright[nodejs]", "pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src/wkapi"]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["error", "ignore:Implicitly cleaning up <HTTPError:ResourceWarning"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY", "D", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = ["**/vendor", "**/__pycache__", ".venv"]
extraPaths = ["src/wkapi"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
